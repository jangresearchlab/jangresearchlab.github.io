- title: Virtual Reality (VR) Fear Conditioning
  description: >
    This project uses immersive virtual reality (VR) combined with [intracranial EEG](https://www.neuropace.com/patients/neuropace-rns-system/) recordings to study how the neural mechanisms underlying the formation and extinction of fear responses in realistic environments. Participants move through richly detailed virtual settings where cues become associated with threat or safety, allowing us to measure how fear memories form, generalize, and change over time. By synchronizing neural activity with behavior, movement, and physiology, we can directly observe how neural circuits encode fear and regulate responses to threat. Ultimately, this work aims to identify neural signatures of fear and anxiety that could guide more precise, circuit-based interventions.  
      *Collaborator(s): Nanthia Suthana (Duke)*

- title: Closed-loop neurostimulation for treatment-resistant PTSD
  description: >
    This project investigates whether [brain-responsive neurostimulation](https://www.neuropace.com/patients/neuropace-rns-system/) can alleviate severe, treatment-resistant PTSD by detecting neural signatures of distress and delivering targeted stimulation in real time. By combining implanted sensing devices with behavioral and physiological measures, we aim to identify when pathological fear circuits become active and intervene at the moment they drive symptoms. This closed-loop approach offers a path toward more precise, personalized neuromodulation for individuals who have not benefited from existing therapies.  
      *Collaborator(s): Nanthia Suthana (Duke), Jean-Philippe Langevin (UCLA/VA)*

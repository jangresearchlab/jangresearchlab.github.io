pi:
  - name: Anthony I Jang, MD
    title: Assistant Professor-In-Residence, Department of Psychiatry and Biobehavioral Sciences
    image: photo_AJ.jpg
    bio: Anthony received his undergraduate degree in neuroscience at Brown University, where he worked with Michael Frank and Matthew Nassar to study how reward prediction errors shape memory. He then completed post-baccalaureate research at the NIH with Kareem Zaghloul, using intracranial EEG and microelectrode recordings to investigate the neural basis of memory, attention, and decision-making. He earned his MD through the Harvard–MIT Program in Health Sciences and Technology (HST), where he trained with Jan Drugowitsch to develop theory-driven models of human choice and eye-movement behavior. After graduating in 2021, he moved to the West Coast to complete his psychiatry residency at UCLA. As a Research Track resident, he worked with Nanthia Suthana, integrating immersive virtual reality, mobile intracranial EEG, and wearable technologies to study fear learning and anxiety. Anthony joined UCLA in Fall 2025 as an Assistant Professor-in-Residence in the Department of Psychiatry and Biobehavioral Sciences. Anthony is interested in integrating intracranial electrophysiology, immersive virtual reality, and computational approaches to understand how the human brain learns, makes decisions, and generates emotion in naturalistic settings. Outside the lab, Anthony enjoys playing tennis, spending time with his wife and two cats, and F1 sim racing. 

